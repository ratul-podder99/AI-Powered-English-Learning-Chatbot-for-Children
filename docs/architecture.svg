<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="520" fill="#fffaf0"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#3b2a14">Ollie the Owl - Architecture</text>

  <!-- client -->
  <rect x="20" y="70" width="190" height="200" rx="12" fill="#e8f7ef" stroke="#4cc38a" stroke-width="2"/>
  <text x="115" y="95" text-anchor="middle" font-weight="bold" fill="#1d6b47">Browser (static SPA)</text>
  <text x="115" y="125" text-anchor="middle" font-size="13">Big-button chat UI</text>
  <text x="115" y="148" text-anchor="middle" font-size="13">Web Speech TTS (voice out)</text>
  <text x="115" y="171" text-anchor="middle" font-size="13">Web Speech STT (voice in)</text>
  <text x="115" y="194" text-anchor="middle" font-size="13">Idle timer → idle ping</text>
  <text x="115" y="217" text-anchor="middle" font-size="13">Progress bar + stars</text>
  <text x="115" y="250" text-anchor="middle" font-size="12" fill="#555">session_id in localStorage</text>

  <!-- api -->
  <rect x="270" y="70" width="140" height="200" rx="12" fill="#eef3ff" stroke="#6b8cff" stroke-width="2"/>
  <text x="340" y="95" text-anchor="middle" font-weight="bold" fill="#2a3fa0">FastAPI</text>
  <text x="340" y="125" text-anchor="middle" font-size="13">POST /api/chat</text>
  <text x="340" y="148" text-anchor="middle" font-size="13">GET /api/health</text>
  <text x="340" y="171" text-anchor="middle" font-size="13">GET /api/session/{id}</text>
  <text x="340" y="194" text-anchor="middle" font-size="13">Timing middleware</text>
  <text x="340" y="217" text-anchor="middle" font-size="13">Input validation</text>

  <!-- engine -->
  <rect x="470" y="60" width="410" height="400" rx="12" fill="#fff3e0" stroke="#ff8a3d" stroke-width="2"/>
  <text x="675" y="85" text-anchor="middle" font-weight="bold" fill="#a8480c">Dialogue Engine (deterministic, &lt; 10 ms)</text>

  <rect x="490" y="100" width="180" height="70" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="580" y="125" text-anchor="middle" font-weight="bold" font-size="14">1. Mode Detector</text>
  <text x="580" y="145" text-anchor="middle" font-size="12">emotion lexicon, safety,</text>
  <text x="580" y="160" text-anchor="middle" font-size="12">boredom, idle, answer attempt</text>

  <rect x="690" y="100" width="170" height="70" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="775" y="125" text-anchor="middle" font-weight="bold" font-size="14">2. Router</text>
  <text x="775" y="145" text-anchor="middle" font-size="12">learn | converse |</text>
  <text x="775" y="160" text-anchor="middle" font-size="12">engage | support</text>

  <rect x="490" y="200" width="115" height="80" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="547" y="225" text-anchor="middle" font-weight="bold" font-size="13">Learn</text>
  <text x="547" y="245" text-anchor="middle" font-size="11">L1/L2/L3 items</text>
  <text x="547" y="260" text-anchor="middle" font-size="11">hint → reveal</text>
  <text x="547" y="274" text-anchor="middle" font-size="11">level up / down</text>

  <rect x="615" y="200" width="115" height="80" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="672" y="225" text-anchor="middle" font-weight="bold" font-size="13">Converse</text>
  <text x="672" y="245" text-anchor="middle" font-size="11">greet, name, check-in</text>
  <text x="672" y="260" text-anchor="middle" font-size="11">context recall</text>
  <text x="672" y="274" text-anchor="middle" font-size="11">open Q → LLM?</text>

  <rect x="740" y="200" width="120" height="80" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="800" y="225" text-anchor="middle" font-weight="bold" font-size="13">Engage / Support</text>
  <text x="800" y="245" text-anchor="middle" font-size="11">jokes, rhymes, stories</text>
  <text x="800" y="260" text-anchor="middle" font-size="11">breathing, naming feelings</text>
  <text x="800" y="274" text-anchor="middle" font-size="11">safety → trusted adult</text>

  <rect x="490" y="310" width="180" height="60" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="580" y="335" text-anchor="middle" font-weight="bold" font-size="13">Curriculum (static)</text>
  <text x="580" y="353" text-anchor="middle" font-size="11">30 items, accepted answers, hints</text>

  <rect x="690" y="310" width="170" height="60" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="775" y="335" text-anchor="middle" font-weight="bold" font-size="13">SEL content</text>
  <text x="775" y="353" text-anchor="middle" font-size="11">praise, feelings, calm-down</text>

  <rect x="490" y="390" width="180" height="55" rx="8" fill="#fff" stroke="#ff8a3d"/>
  <text x="580" y="413" text-anchor="middle" font-weight="bold" font-size="13">Session Store (memory, TTL)</text>
  <text x="580" y="431" text-anchor="middle" font-size="11">level, mastery, mood, history</text>

  <rect x="690" y="390" width="170" height="55" rx="8" fill="#f4f0ff" stroke="#9b7bff" stroke-dasharray="5 4"/>
  <text x="775" y="413" text-anchor="middle" font-weight="bold" font-size="13">Optional LLM (Claude)</text>
  <text x="775" y="431" text-anchor="middle" font-size="11">1.3 s timeout → rules fallback</text>

  <!-- arrows -->
  <line x1="210" y1="170" x2="268" y2="170" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="170" x2="468" y2="170" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="670" y1="135" x2="688" y2="135" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="775" y1="170" x2="775" y2="198" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="547" y1="280" x2="547" y2="308" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="280" x2="800" y2="308" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="370" x2="580" y2="388" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="280" x2="735" y2="388" stroke="#9b7bff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="450" y="495" text-anchor="middle" font-size="13" fill="#555">Typical request: ~1-3 ms engine time + network. LLM only on open-ended chat, never on lessons.</text>
</svg>
